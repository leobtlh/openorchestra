[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openorchestra"
version = "0.1.0"
description = "An agnostic multi-agent orchestrator for code generation and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
    {name = "OpenOrchestra Contributors"}
]
keywords = ["ai-agents", "multi-agent", "code-generation", "evaluation", "orchestrator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sqlite-utils>=3.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "safety>=2.0.0",
]

[project.scripts]
openorchestra = "openorchestra.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openorchestra*"]

[tool.setuptools.package-data]
openorchestra = ["configs/*.yaml", "skills/*.yaml", "py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
